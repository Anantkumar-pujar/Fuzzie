name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fuzzie:fuzzie_password@localhost:5432/fuzzie?schema=public
      DIRECT_URL: postgresql://fuzzie:fuzzie_password@localhost:5432/fuzzie?schema=public
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_DOMAIN: localhost:3000
      NEXT_PUBLIC_SCHEME: http
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fuzzie
          POSTGRES_PASSWORD: fuzzie_password
          POSTGRES_DB: fuzzie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuzzie -d fuzzie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t fuzzie-app:${{ github.sha }} .
