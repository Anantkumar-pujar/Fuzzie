services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* values are inlined into the browser bundle at BUILD time,
      # so the Clerk publishable key must be passed here as a build arg — setting
      # it only under `environment` (runtime) leaves the client bundle broken.
      # The value is interpolated from your shell / a project-level .env file.
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    image: fuzzie-app:local
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://fuzzie:fuzzie_password@postgres:5432/fuzzie?schema=public
      DIRECT_URL: postgresql://fuzzie:fuzzie_password@postgres:5432/fuzzie?schema=public
      NEXT_PUBLIC_URL: http://localhost:3001
      NEXT_PUBLIC_DOMAIN: localhost:3001
      NEXT_PUBLIC_SCHEME: http
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
    env_file:
      - .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-off schema initializer. This project has no migrations history, so it
  # applies the schema with `prisma db push`. It builds the `builder` stage,
  # which carries the full Prisma CLI + dependencies (the slim app image does
  # not). Runs to completion once, then the app starts.
  migrate:
    build:
      context: .
      target: migrator
    image: fuzzie-migrate:local
    command: ["npx", "prisma", "db", "push", "--skip-generate", "--accept-data-loss"]
    environment:
      DATABASE_URL: postgresql://fuzzie:fuzzie_password@postgres:5432/fuzzie?schema=public
      DIRECT_URL: postgresql://fuzzie:fuzzie_password@postgres:5432/fuzzie?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fuzzie
      POSTGRES_PASSWORD: fuzzie_password
      POSTGRES_DB: fuzzie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzzie -d fuzzie"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
